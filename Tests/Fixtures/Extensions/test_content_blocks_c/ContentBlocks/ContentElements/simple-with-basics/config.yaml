group: common
name: simple/basics
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
basicsOverrides:
  frame_class:
    label: Frame from override
    default: ruler-before
  basic_field:
    label: Label from override
    required: true
fields:
  - identifier: palette
    type: Palette
    fields:
      - identifier: header
        useExistingField: true
      - type: Linebreak
      - identifier: bodytext
        useExistingField: true
      - identifier: Simple/Basic
        type: Basic
