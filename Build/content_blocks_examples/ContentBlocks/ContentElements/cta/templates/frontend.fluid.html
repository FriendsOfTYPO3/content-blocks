<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:asset.css identifier="cbCtaCssFrontend" href="{cb:assetPath()}/frontend.css"/>

<div class="cb-cta">
    <f:if condition="{data.backgroundImage}">
        <picture class="cb-cta-bg">
            <source media="(max-width: 767px)" srcset="{f:uri.image(image: data.backgroundImage, cropVariant: 'mobile', maxWidth: 767)}"/>
            <f:image image="{data.backgroundImage}" maxWidth="1920" alt=""/>
        </picture>
    </f:if>
    <div class="overlay">
        <h2>{data.title}</h2>
        <f:format.raw>{data.text}</f:format.raw>
        <p class="text-center">
            <f:link.typolink parameter="{data.link}" class="btn-cta">{data.linkTitle}</f:link.typolink>
        </p>
    </div>
</div>

</html>
